[package]
name = "tfsv"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal-native Linux file manager for local and SSH sessions"
readme = "README.md"
repository = "https://github.com/aayushrambo8/Terminal-File-System-VIsualiser"
license = "GPL-3.0-only"
keywords = ["terminal", "file-manager", "tui", "filesystem", "ssh"]
categories = ["command-line-utilities", "filesystem"]
default-run = "tfsv"
include = [
    "/src/**",
    "/tests/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/install.sh",
]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1"
dirs = "5"
unicode-width = "0.2"
